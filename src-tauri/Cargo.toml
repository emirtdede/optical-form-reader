[package]
name = "optical-form-reader"
version = "1.0.0"
description = "Optical Form Reader by Vellium — Local-first OMR and academic grading suite for Windows 11."
authors = ["Vellium Teknoloji Anonim Sirketi <support@vellium.dev>"]
homepage = "https://optikformokuyucu.com"
license = "MIT"
edition = "2021"
default-run = "optical-form-reader"

[lib]
name = "optical_form_reader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png", "tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Storage_Packaging_Appx",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
