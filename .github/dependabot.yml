version: 2

updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Europe/Istanbul
    open-pull-requests-limit: 5
    versioning-strategy: increase
    labels:
      - dependencies
    assignees:
      - emirtdede
    commit-message:
      prefix: chore
      prefix-development: chore
      include: scope
    groups:
      npm-development:
        applies-to: version-updates
        dependency-type: development
        update-types:
          - minor
          - patch
      npm-production:
        applies-to: version-updates
        dependency-type: production
        update-types:
          - minor
          - patch

  - package-ecosystem: cargo
    directory: "/src-tauri"
    schedule:
      interval: weekly
      day: monday
      time: "04:15"
      timezone: Europe/Istanbul
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - rust
    assignees:
      - emirtdede
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "04:30"
      timezone: Europe/Istanbul
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci
    assignees:
      - emirtdede
    commit-message:
      prefix: ci
      include: scope
    groups:
      github-actions:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
