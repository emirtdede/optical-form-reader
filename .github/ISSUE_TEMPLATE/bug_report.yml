name: Bug report
description: Report a reproducible defect in Optical Form Reader.
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve Optical Form Reader. Do **not** report security
        vulnerabilities here. Use the
        [security policy](https://github.com/emirtdede/optical-form-reader/security/policy)
        instead.

        You can write in Turkish or English.

  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
        - label: I am running the latest available Optical Form Reader release.
          required: true
        - label: This report does not contain a security vulnerability or real student personal data.
          required: true

  - type: input
    id: version
    attributes:
      label: Optical Form Reader version
      description: Shown under About (Hakkında).
      placeholder: "1.0.0"
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Windows version / Browser
      placeholder: "Windows 11 24H2 (26100)"
    validations:
      required: true

  - type: dropdown
    id: install
    attributes:
      label: Platform / Installation type
      options:
        - Microsoft Store (MSIX)
        - Windows Desktop (NSIS installer)
        - Windows Desktop (Portable .exe)
        - Web Application (optikformokuyucu.com)
        - Built from source
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Select template ...
        3. Start scan ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
