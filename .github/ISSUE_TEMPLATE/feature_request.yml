name: Feature request
description: Suggest a new capability or improvement to Optical Form Reader.
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for sharing an idea. You can write in Turkish or English.

  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior, template, or analytics feature you expect.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Optical Mark Recognition (OpenCV WASM / Live Camera)
        - Templates & Custom A4 PDF Generator
        - Grading, KR-20 Analytics & Bell Curve
        - PDF Scorecards & Excel/CSV Exports
        - Windows 11 Desktop Shell, Themes & Localization
        - Documentation
        - Other
    validations:
      required: true
