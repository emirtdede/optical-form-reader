# Weekly check for vulnerabilities published after the last push.
name: Dependency audit

on:
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-audit
  cancel-in-progress: true

jobs:
  audit:
    name: npm production dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22.14.0
          cache: npm

      - name: Audit production dependencies
        run: npm audit --package-lock-only --omit=dev --audit-level=high
