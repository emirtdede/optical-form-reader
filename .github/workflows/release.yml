# Optical Form Reader Release Pipeline
# Builds and publishes ALL 4 Windows 11 distribution packages to GitHub Releases:
#   1. Optical-Form-Reader-<version>-x64.msix       (Microsoft Store / Sideload MSIX)
#   2. Optical-Form-Reader-<version>-x64-Setup.exe  (NSIS 73-Language Installer)
#   3. Optical-Form-Reader-<version>-x64.msi        (Enterprise Windows Installer MSI)
#   4. Optical-Form-Reader-<version>-Portable.exe   (Standalone Portable Executable)
#   5. latest-release.json                          (Zero-rate-limit CDN update feed)
#   6. SHA256SUMS.txt & BUILD_INFO.json             (Cryptographic provenance)
name: Release

on:
  push:
    tags:
      - "1.0.0"
      - "v*.*.*"
      - "[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-windows:
    name: Build & Publish Windows 11 Packages (MSIX, NSIS Setup, MSI, Portable)
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install dependencies
        run: npm ci

      - name: Generate monochrome & Store icons and sync 73 NSIS languages
        run: |
          npm run icons:generate
          node scripts/sync-nsis-languages.mjs

      - name: Run quality & long-dash gates
        run: |
          node scripts/check-no-long-dash.mjs
          npm run check
          cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build all desktop release packages (NSIS Setup, MSI, Portable, MSIX)
        run: node scripts/build-release.mjs

      - name: Upload GitHub Release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            release/Optical-Form-Reader-*.msix
            release/Optical-Form-Reader-*.exe
            release/Optical-Form-Reader-*.msi
            release/latest-release.json
            release/SHA256SUMS.txt
            release/BUILD_INFO.json
          generate_release_notes: true
          fail_on_unmatched_files: true
