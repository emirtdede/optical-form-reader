# Optical Form Reader CI
# Windows 11 Tauri 2 Desktop + React 19 Web OMR Suite
name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, unit tests, 73-locale parity & Rust core
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22.14.0
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install dependencies
        run: npm ci

      - name: Runtime dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Verify monochrome icon & installer asset generation
        run: npm run icons:generate

      - name: Typecheck, production Web build, Vitest suite & 73-locale check
        run: npm run check

      - name: Run Tauri Rust core unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
